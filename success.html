<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Confirmed - TechSummit 2026</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes bounceCheck {
      0% { transform: scale(0); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .confirmation-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .check-icon {
      width: 72px;
      height: 72px;
      background-color: rgba(34, 197, 94, 0.2);
      border: 2px solid #22c55e;
      color: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 20px;
      animation: bounceCheck 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    h1 {
      font-size: 1.8rem;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .back-btn {
      display: inline-block;
      width: 100%;
      background-color: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .back-btn:hover {
      background-color: #7dd3fc;
    }

    .back-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="confirmation-card">
    <div class="check-icon">✓</div>
    <h1>You're All Set!</h1>
    <p>Your registration for TechSummit 2026 has been received. Your digital attendee badge and workshop pass will arrive in your college inbox shortly.</p>
    <a href="index.html" class="back-btn">← Return to Portal Homepage</a>
  </div>

</body>
</html>
